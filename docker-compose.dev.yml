services:
  postgres:
    image: postgres:17-alpine
    container_name: leren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leren
      POSTGRES_PASSWORD: leren
      POSTGRES_DB: leren
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leren -d leren"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: leren-qdrant
    restart: unless-stopped
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: leren-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: leren
      RABBITMQ_DEFAULT_PASS: leren
    ports:
      - "56720:5672"
      - "56721:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leren-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: leren-mailpit
    restart: unless-stopped
    ports:
      - "51025:1025"
      - "58025:8025"

volumes:
  postgres-data:
  qdrant-data:
  rabbitmq-data:
  redis-data:
