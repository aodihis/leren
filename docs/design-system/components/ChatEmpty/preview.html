<!-- @dsCard group="Assistant" height=560 subtitle="New chat, before the first message" -->
<div style="padding:16px;background:var(--bg-canvas)"><div style="width:400px;height:520px;display:flex;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden"><aside class="v-chat" style="border-left:0;flex:1"><div class="v-chat__head"><span class="v-chat__title">New chat</span><button class="v-iconbtn" aria-label="Expand"><svg class="v-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button><button class="v-iconbtn" aria-label="Close"><svg class="v-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="v-chat__body" style="justify-content:center"><div class="v-empty"><span class="v-empty__icon"><svg class="v-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></svg></span><div class="v-empty__title">How can I help while you're away?</div><div style="font-size:13px;line-height:18px">Ask about a decision I made, add knowledge, or test a rule with a simulated email.</div></div></div>
<div class="v-chat__foot">
  <div class="v-suggest"><button class="v-chip">Add knowledge</button>
    <button class="v-chip">Simulate an incoming email</button>
    <button class="v-chip">What's waiting for approval?</button>
  </div>
  <div class="v-composer">
    <textarea rows="2" placeholder="Ask a question or add knowledge…" aria-label="Message"></textarea>
    <div class="v-composer__bar">
      <button class="v-iconbtn" aria-label="Attach file"><svg class="v-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></button>
      <button class="v-send" aria-label="Send"><svg class="v-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </div>
  <div class="v-fine">Draft-only mode · nothing is sent without your approval</div>
</div></aside></div></div>
