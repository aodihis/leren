services:
  postgres:
    image: postgres:17-alpine
    container_name: leren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leren
      POSTGRES_PASSWORD: leren
      POSTGRES_DB: leren
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leren -d leren"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: leren-qdrant
    restart: unless-stopped
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: leren-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: leren
      RABBITMQ_DEFAULT_PASS: leren
    ports:
      - "56720:5672"
      - "56721:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  qdrant-data:
  rabbitmq-data:
